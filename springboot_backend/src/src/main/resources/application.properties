
# ---------------------------------------------------------------
# IntelliGen Application Configuration
# ---------------------------------------------------------------

# Local configuration is stored outside the project.
spring.config.import=optional:file:${user.home}/.intelligen/application-local.properties

# Application
spring.application.name=IntelliGen
server.port=8080

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/intelligen_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:D:/uploads/notes/}
file.result-dir=${FILE_RESULT_DIR:D:/uploads/results/}

# Maximum File Upload Size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Session Configuration
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:8080}

# Flask AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}
ai.service.key=${AI_SERVICE_KEY:}
