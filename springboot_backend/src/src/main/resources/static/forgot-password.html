<!DOCTYPE html>
<html lang="en">
<head>
    <script src="api.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | IntelliGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth-main" style="min-height:100vh">
    <div class="auth-card">
        <div class="auth-brand mb-8">
            <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-brain"></i></div>
            <span class="text-lg font-bold" style="color:var(--ink)">IntelliGen</span>
        </div>
        <div class="auth-card-surface">
            <h1>Forgot Password?</h1>
            <p class="auth-sub">Enter your registered email address and we will send you a link to reset your password.</p>

            <form id="forgotForm" class="mt-7 space-y-5" novalidate>
                <div>
                    <label for="email" class="field-label">Email Address</label>
                    <input id="email" type="email" required autocomplete="email" autocapitalize="none" spellcheck="false"
                           maxlength="254" class="field-input" placeholder="name@college.edu" aria-describedby="emailError">
                    <p id="emailError" class="field-error" hidden></p>
                </div>
                <div id="message" role="status" aria-live="polite" class="auth-alert" hidden></div>
                <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-full">Send Reset Link</button>
            </form>
        </div>
        <p class="text-center mt-6 text-sm"><a href="/login.html" class="link"><i class="fa-solid fa-arrow-left mr-1" aria-hidden="true"></i>Back to Sign In</a></p>
    </div>
</main>

<script>
    var form = document.getElementById("forgotForm");
    var message = document.getElementById("message");
    var button = document.getElementById("submitBtn");
    var emailInput = document.getElementById("email");
    var emailError = document.getElementById("emailError");
    var busy = false;

    function show(kind, text) {
        message.className = "auth-alert auth-alert-" + kind;
        message.textContent = text;
        message.hidden = false;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (busy) return;
        message.hidden = true;
        emailError.hidden = true;
        emailInput.removeAttribute("aria-invalid");

        var email = emailInput.value.trim();
        if (!email || !emailInput.checkValidity()) {
            emailError.textContent = "Enter a valid email address.";
            emailError.hidden = false;
            emailInput.setAttribute("aria-invalid", "true");
            emailInput.focus();
            return;
        }

        busy = true;
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Sending...';

        try {
            var response = await fetch("/api/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            });
            var data = null;
            try { data = await response.json(); } catch (e) { data = null; }
            var text = (data && (data.message || data.error)) || "Unable to process the request. Please try again.";
            show(response.ok ? "success" : "error", text);
        } catch (error) {
            show("error", "Could not reach the server. Please try again.");
        } finally {
            busy = false;
            button.disabled = false;
            button.textContent = "Send Reset Link";
        }
    });
</script>
</body>
</html>
