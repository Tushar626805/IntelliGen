<!DOCTYPE html>
<html lang="en">
<head>
    <script src="api.js"></script>
    <script src="auth-ui.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | IntelliGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth-main" style="min-height:100vh">
    <div class="auth-card">
        <div class="auth-brand mb-8">
            <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-brain"></i></div>
            <span class="text-lg font-bold" style="color:var(--ink)">IntelliGen</span>
        </div>
        <div class="auth-card-surface">
            <h1>Set a New Password</h1>
            <p class="auth-sub">Choose a new password with 8 to 72 characters.</p>

            <form id="resetForm" class="mt-7 space-y-5" novalidate>
                <div>
                    <label for="password" class="field-label">New Password</label>
                    <input id="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"
                           class="field-input" placeholder="At least 8 characters" aria-describedby="passwordError">
                    <p id="passwordError" class="field-error" hidden></p>
                </div>
                <div>
                    <label for="confirmPassword" class="field-label">Confirm New Password</label>
                    <input id="confirmPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password"
                           class="field-input" placeholder="Enter the password again" aria-describedby="confirmError">
                    <p id="confirmError" class="field-error" hidden></p>
                </div>
                <div id="message" role="status" aria-live="polite" class="auth-alert" hidden></div>
                <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-full">Reset Password</button>
            </form>
        </div>
        <p class="text-center mt-6 text-sm"><a href="/login.html" class="link"><i class="fa-solid fa-arrow-left mr-1" aria-hidden="true"></i>Back to Sign In</a></p>
    </div>
</main>

<script>
    var form = document.getElementById("resetForm");
    var message = document.getElementById("message");
    var button = document.getElementById("submitBtn");
    var token = new URLSearchParams(location.search).get("token");
    var busy = false;

    function show(kind, text) {
        message.className = "auth-alert auth-alert-" + kind;
        message.textContent = text;
        message.hidden = false;
    }
    function fieldError(inputId, errorId, text) {
        document.getElementById(inputId).setAttribute("aria-invalid", "true");
        var el = document.getElementById(errorId); el.textContent = text; el.hidden = false;
    }
    function clearErrors() {
        message.hidden = true;
        ["password", "confirmPassword"].forEach(function (id) { document.getElementById(id).removeAttribute("aria-invalid"); });
        ["passwordError", "confirmError"].forEach(function (id) { var el = document.getElementById(id); el.hidden = true; el.textContent = ""; });
    }

    if (!token) {
        show("error", "The reset link is missing its token. Request a new reset link from the Forgot Password page.");
        button.disabled = true;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (busy || !token) return;
        clearErrors();

        var password = document.getElementById("password").value;
        var confirmation = document.getElementById("confirmPassword").value;

        if (password.length < 8 || password.length > 72) {
            fieldError("password", "passwordError", "Password must contain between 8 and 72 characters.");
            document.getElementById("password").focus();
            return;
        }
        if (password !== confirmation) {
            fieldError("confirmPassword", "confirmError", "Passwords do not match.");
            document.getElementById("confirmPassword").focus();
            return;
        }

        busy = true;
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Updating...';
        var done = false;

        try {
            var response = await fetch("/api/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: token, password: password })
            });
            var data = null;
            try { data = await response.json(); } catch (e) { data = null; }
            var text = (data && (data.message || data.error)) || (response.ok ? "Your password has been updated." : "Unable to reset the password.");

            if (response.ok) {
                done = true;
                form.reset();
                form.querySelectorAll("input").forEach(function (input) { input.disabled = true; });
                show("success", text + " You can now sign in with your new password.");
            } else {
                show("error", text);
            }
        } catch (error) {
            show("error", "Could not reach the server. Please try again.");
        } finally {
            busy = false;
            button.textContent = "Reset Password";
            button.disabled = done;
        }
    });
</script>
</body>
</html>
